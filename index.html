  <style>:root {
  --bg: #12161c;
  --panel: #1c222b;
  --panel2: #252d38;
  --text: #e8edf3;
  --muted: #9aa7b6;
  --accent: #2f9bff;
  --danger: #ff5c5c;
  --border: #333d4a;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text); font: 15px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; overflow: hidden; }
#map { position: absolute; inset: 0; background: #000; }
.hidden { display: none !important; }

button { font: inherit; color: var(--text); background: var(--panel2); border: 1px solid var(--border); border-radius: 10px; padding: 8px 12px; cursor: pointer; }
button:active { filter: brightness(1.3); }
button.primary { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 600; }
button.danger { color: var(--danger); }

#topbar { position: absolute; z-index: 1000; top: calc(8px + env(safe-area-inset-top)); left: 8px; right: 8px; display: flex; gap: 6px; flex-wrap: wrap; pointer-events: none; }
#topbar button { pointer-events: auto; background: rgba(28,34,43,.92); box-shadow: 0 2px 8px rgba(0,0,0,.4); }
#topbar button.primary { background: var(--accent); }
.badge { background: var(--accent); color: #fff; border-radius: 9px; padding: 0 6px; font-size: 12px; margin-left: 2px; }

#fab { position: absolute; z-index: 1000; right: 10px; bottom: calc(110px + env(safe-area-inset-bottom)); display: flex; flex-direction: column; gap: 10px; }
#fab button { width: 48px; height: 48px; border-radius: 50%; font-size: 20px; padding: 0; background: rgba(28,34,43,.92); box-shadow: 0 2px 8px rgba(0,0,0,.5); }
#fab button.on { background: var(--accent); }

#crosshair { position: absolute; z-index: 900; left: 50%; top: 50%; width: 30px; height: 30px; margin: -15px 0 0 -15px; pointer-events: none; }
#crosshair::before, #crosshair::after { content: ""; position: absolute; background: #ff3b3b; box-shadow: 0 0 2px #000; }
#crosshair::before { left: 14px; top: 0; width: 2px; height: 30px; }
#crosshair::after { top: 14px; left: 0; height: 2px; width: 30px; }

#coordBox, #measureBox { position: absolute; z-index: 1000; left: 8px; right: 70px; bottom: calc(26px + env(safe-area-inset-bottom)); background: rgba(28,34,43,.94); border: 1px solid var(--border); border-radius: 12px; padding: 8px 10px; font-size: 13px; font-variant-numeric: tabular-nums; }
#coordBox b { color: #ffd54a; }
#measureBox .row { display: flex; gap: 6px; margin-top: 6px; }
#measureBox .row button { padding: 5px 10px; font-size: 13px; }

#sheet { position: absolute; z-index: 1100; left: 0; right: 0; bottom: 0; max-height: 90%; background: var(--panel); border-radius: 16px 16px 0 0; box-shadow: 0 -4px 20px rgba(0,0,0,.5); display: flex; flex-direction: column; padding-bottom: env(safe-area-inset-bottom); transition: none; }
.sheet-head { display: flex; align-items: center; justify-content: space-between; padding: 10px 14px; border-bottom: 1px solid var(--border); cursor: ns-resize; user-select: none; -webkit-user-select: none; position: relative; }
.sheet-head::before { content: ''; position: absolute; top: 5px; left: 50%; transform: translateX(-50%); width: 36px; height: 4px; border-radius: 2px; background: rgba(255,255,255,.25); pointer-events: none; }
.sheet-head h2 { margin: 0; font-size: 17px; pointer-events: none; }
.sheet-head button { border: none; background: none; font-size: 20px; cursor: pointer; pointer-events: auto; position: relative; z-index: 1; }
#sheetBody { overflow-y: auto; padding: 10px 14px 16px; }

label.f { display: block; margin: 10px 0 4px; color: var(--muted); font-size: 13px; }
select, input[type=number], input[type=text] { width: 100%; font: inherit; color: var(--text); background: var(--panel2); border: 1px solid var(--border); border-radius: 8px; padding: 8px; }
.radio { display: flex; align-items: center; gap: 8px; padding: 9px 4px; border-bottom: 1px solid var(--border); }
.radio input { width: 18px; height: 18px; }
.hint { color: var(--muted); font-size: 12.5px; margin-top: 8px; }
.btnrow { display: flex; gap: 8px; margin-top: 14px; flex-wrap: wrap; }

.layer { border: 1px solid var(--border); border-radius: 12px; padding: 10px; margin-bottom: 10px; background: var(--panel2); }
.layer .top { display: flex; align-items: center; gap: 8px; }

    'Lào Cai': [103.5, 21.85, 104.65, 22.85], 'Yên Bái': [103.9, 21.3, 105.1, 22.3], 'Hà Giang': [104.3, 22.1, 105.6, 23.4],

    'Cao Bằng': [105.25, 22.35, 106.85, 23.15], 'Lạng Sơn': [106.1, 21.3, 107.4, 22.45], 'Bắc Kạn': [105.45, 21.8, 106.25, 22.75],
    'Thái Nguyên': [105.45, 21.3, 106.25, 22.05], 'Bắc Giang': [105.85, 21.1, 107.05, 21.65], 'Bắc Ninh': [105.9, 20.95, 106.3, 21.3],
    'Quảng Ninh': [106.4, 20.65, 108.1, 21.7], 'Hải Phòng': [106.4, 20.55, 107.15, 21.05], 'Hải Dương': [106.0, 20.65, 106.65, 21.25],

  /**
   * Tự nhận kinh tuyến trục: thử từng KTT, chiếu tâm bản vẽ (E, N) ra kinh/vĩ độ,

   * Trả về {lon0, prov} hoặc null.
   */
  /**
   * opt.names: Map tên tỉnh -> số lần xuất hiện trong chữ trên bản vẽ ("TỈNH ĐỒNG NAI"…)
   * opt.prefer: tên tỉnh người dùng đang chọn (ưu tiên phương án gần tỉnh này)
   * Trả về {lon0, prov, why, cands:[{lon0, prov}]} hoặc null.
   */
  function detectLon0(E, N, k, opt) {
    opt = opt || {};
    if (!(N > 800000 && N < 2700000 && E > 100000 && E < 900000)) return null;
    const lonOf = (name) => { const p = PROVINCES.find(q => q[0] === name); return p ? p[1] : null; };
    // 1. Tên tỉnh ghi trên bản vẽ
    if (opt.names && opt.names.size) {
      for (const [top] of Array.from(opt.names.entries()).sort((a, b) => b[1] - a[1])) {
        const l = lonOf(top), b = BBOX[top];
        if (l == null || !b) continue;
        // chỉ tin tên tỉnh khi theo KTT của tỉnh đó bản vẽ nằm trong (hoặc sát) tỉnh ấy
        const r = proj4(vn2000(l, k || 0.9999), 'WGS84', [E, N]), m = 0.3;
        if (r[0] >= b[0] - m && r[0] <= b[2] + m && r[1] >= b[1] - m && r[1] <= b[3] + m) return { lon0: l, prov: top, why: 'theo chữ trên bản vẽ', cands: [] };
      }
    }
    // 2. Vị trí: KTT nào đưa bản vẽ vào đúng một tỉnh dùng KTT đó
    const lons = Array.from(new Set(PROVINCES.map(p => p[1])));
    const cands = [];
    for (const lon0 of lons) {
      let r;
      try { r = proj4(vn2000(lon0, k || 0.9999), 'WGS84', [E, N]); } catch (e) { continue; }
      const x = r[0], y = r[1];
      let best = null;
      for (const [name, l] of PROVINCES) {
        if (l !== lon0) continue;
        const b = BBOX[name]; if (!b) continue;
        const m = 0.15;
        if (x < b[0] - m || x > b[2] + m || y < b[1] - m || y > b[3] + m) continue;
        const hx = (b[2] - b[0]) / 2, hy = (b[3] - b[1]) / 2;
        const s = Math.pow((x - (b[0] + hx)) / hx, 2) + Math.pow((y - (b[1] + hy)) / hy, 2);
        if (!best || s < best.s) best = { lon0, prov: name, s, x, y };
      }
      if (best) cands.push(best);
    }
    if (!cands.length) return null;
    const pb = opt.prefer && BBOX[opt.prefer];
    cands.sort((a, b) => a.s - b.s);
    if (pb) {
      // Ưu tiên theo khoảng cách KTT: tỉnh ưa thích lon0=X → candidate lon0 gần X được ưu tiên
      const prefLon0 = lonOf(opt.prefer);
      if (prefLon0 != null) {
        const w = opt.w != null ? opt.w : 3;
        cands.forEach(c => { c.dl = Math.abs(c.lon0 - prefLon0); });
        cands.sort((a, b) => (a.s + w * a.dl) - (b.s + w * b.dl));
      }
    }
    const c = cands[0];
    return { lon0: c.lon0, prov: c.prov, why: 'theo vị trí', cands: cands.map(q => ({ lon0: q.lon0, prov: q.prov })) };
  }

  const fold = (s) => String(s).normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/đ/g, 'd').replace(/Đ/g, 'D').toLowerCase();
  /** Tìm "TỈNH …" / "THÀNH PHỐ …" trong chữ của bản vẽ. Trả về Map tên tỉnh -> số lần. */
  function provinceNames(features) {
    const keys = PROVINCES.map(([n]) => [n, fold(n.replace(/^TP\.\s*/, '')).replace(/\s*-\s*/g, ' ')]);
    const found = new Map();
    let n = 0;
    for (const f of features) {
      if (f.kind !== 'text' || !f.text) continue;
      if (++n > 50000) break;
      const t = fold(f.text).replace(/\s*-\s*/g, ' ').replace(/\s+/g, ' ');
      if (t.indexOf('tinh') < 0 && t.indexOf('thanh pho') < 0 && t.indexOf('tp') < 0) continue;
      for (const [name, k] of keys) {
        if (t.indexOf('tinh ' + k) >= 0 || t.indexOf('thanh pho ' + k) >= 0 || t.indexOf('tp ' + k) >= 0 || t.indexOf('tp. ' + k) >= 0) found.set(name, (found.get(name) || 0) + 1);

  function vn2000(lon0, k) {

  }

  /** settings: {mode:'auto'|'vn3'|'vn6'|'utm48'|'utm49'|'wgs84', lon0, swap:'auto'|'yes'|'no'} */
  function projString(mode, lon0) {
    switch (mode) {
      case 'vn6': return vn2000(lon0, 0.9996);
      case 'utm48': return '+proj=utm +zone=48 +datum=WGS84 +units=m +no_defs';
      case 'utm49': return '+proj=utm +zone=49 +datum=WGS84 +units=m +no_defs';

  // Khung bao "bền": bỏ 0,1% điểm lạc hai đầu để một vài điểm rác không làm hỏng việc nhận dạng hệ tọa độ
  function bboxOf(features) {
    let n = 0;
    for (const f of features) n += f.pts.length;
    const step = Math.max(1, Math.floor(n / 40000));
    const xs = [], ys = [];
    let k = 0;
    for (const f of features) for (const p of f.pts) {

      if (!isFinite(p[0]) || !isFinite(p[1])) continue;
      xs.push(p[0]); ys.push(p[1]);

  /** Đọc .prj (WKT) để đoán hệ tọa độ. Trả về {mode, lon0} hoặc null. */
  function fromPrj(wkt) {

    const s = wkt.toUpperCase();
    const isProj = /PROJCS|PROJCRS/.test(s);
    if (!isProj) return { mode: 'wgs84' };
    const cm = /CENTRAL_MERIDIAN"?\s*,\s*([-\d.]+)/.exec(s) || /LONGITUDE OF NATURAL ORIGIN"?\s*,\s*([-\d.]+)/.exec(s);
    const kf = /SCALE_FACTOR"?\s*,\s*([\d.]+)/.exec(s);
    const lon0 = cm ? parseFloat(cm[1]) : null;
    const k = kf ? parseFloat(kf[1]) : null;
    if (/VN.?2000|VN_2000|VN2000/.test(s)) {
      return { mode: k && Math.abs(k - 0.9996) < 1e-6 ? 'vn6' : 'vn3', lon0: lon0 || 105 };
    }
    if (/UTM/.test(s) && /WGS/.test(s)) {
      if (lon0 === 105) return { mode: 'utm48' };
      if (lon0 === 111) return { mode: 'utm49' };
    }
    return { mode: 'wkt', wkt };
  }

  /**
   * Tạo hàm chuyển tọa độ file -> [lat, lng] cho Leaflet.
   * Trả về {fn, info}.
   */
  function makeTransform(features, settings, prjHint) {
    const bb = bboxOf(features);
    let mode = settings.mode, lon0 = settings.lon0, wkt = null, note = '';
    const looksGeo0 = bb[0] >= -180 && bb[2] <= 180 && bb[1] >= -90 && bb[3] <= 90;
    if (prjHint && prjHint.mode === 'wgs84' && !looksGeo0) prjHint = null;
    if (prjHint && settings.usePrj !== false) {
      if (prjHint.mode === 'wkt') { mode = 'wkt'; wkt = prjHint.wkt; }
      else { mode = prjHint.mode; if (prjHint.lon0) lon0 = prjHint.lon0; }
      note = 'theo file .prj';
    }
    const looksGeo = bb[0] >= -180 && bb[2] <= 180 && bb[1] >= -90 && bb[3] <= 90;
    if (mode === 'auto') mode = looksGeo ? 'wgs84' : 'vn3';
    if (mode !== 'wgs84' && looksGeo && !prjHint) { mode = 'wgs84'; note = 'tọa độ dạng độ (lon/lat)'; }

    let swap = settings.swap === 'yes';
    if (settings.swap === 'auto' && mode !== 'wgs84') {
      // VN-2000: X(Đông) ~ 100.000–900.000 ; Y(Bắc) ~ 900.000–2.700.000
      const cx = (bb[0] + bb[2]) / 2, cy = (bb[1] + bb[3]) / 2;
      if (cx > 900000 && cy < 900000) { swap = true; note += (note ? ', ' : '') + 'tự đảo X/Y'; }
    }
    let warn = '', detected = null;
    if (mode === 'vn3' || mode === 'vn6') {
      const n = swap ? (bb[0] + bb[2]) / 2 : (bb[1] + bb[3]) / 2;
      const e = swap ? (bb[1] + bb[3]) / 2 : (bb[0] + bb[2]) / 2;
      if (!(n > 800000 && n < 2700000 && e > 100000 && e < 900000)) warn = 'Tọa độ không giống VN-2000 (có thể là bản vẽ tọa độ giả định/cục bộ) nên sẽ không nằm đúng trên ảnh vệ tinh.';
      // File không có .prj (DGN, DWG, DXF…): tự nhận kinh tuyến trục theo vị trí
      else if (!note.includes('.prj') && settings.autoLon0 !== false) {
        const d = detectLon0(e, n, mode === 'vn6' ? 0.9996 : 0.9999, { names: provinceNames(features), prefer: settings.prov });
        if (d) { lon0 = d.lon0; note += (note ? ', ' : '') + 'tự nhận: ' + d.prov + ' ' + d.why; detected = d; }
      }
    }
    let fwd;
    if (mode === 'wgs84') {
      fwd = (p) => [p[1], p[0]];
    } else {
      const def = mode === 'wkt' ? wkt : projString(mode, lon0);
      const conv = proj4(def, 'WGS84');
      fwd = (p) => { const r = conv.forward(p); return [r[1], r[0]]; };
    }
    let fn = swap ? (p) => fwd([p[1], p[0]]) : fwd;
    // Bộ dữ liệu lớn: nội suy song tuyến trên lưới thay vì gọi proj4 cho từng đỉnh (nhanh hơn hàng chục lần, sai số < 1 cm)
    if (mode !== 'wgs84') {
      let nv = 0; for (const f of features) nv += f.pts.length;
      if (nv > 30000) fn = gridTransform(fn, bb, swap);
    }
    const label = describe(mode, lon0) + (note ? ' (' + note + ')' : '');
    return { fn, info: { mode, lon0, swap, label, bbox: bb, warn, detected, center: [(bb[0] + bb[2]) / 2, (bb[1] + bb[3]) / 2] } };
  }

  /** Hàm chiếu nhanh: nội suy song tuyến từ lưới điểm đã chiếu chính xác. bb = bbox tọa độ file. */
  function gridTransform(exact, bb, swap) {
    const x0 = bb[0], y0 = bb[1], x1 = bb[2], y1 = bb[3];
    const w = x1 - x0, h = y1 - y0;
    if (!(w >= 0 && h >= 0) || !isFinite(w + h)) return exact;
    const n = 160;
    const nx = w < 1e-6 ? 1 : n, ny = h < 1e-6 ? 1 : n;
    const sx = nx > 1 ? w / (nx) : 0, sy = ny > 1 ? h / (ny) : 0;
    const lat = new Float64Array((nx + 1) * (ny + 1)), lng = new Float64Array((nx + 1) * (ny + 1));
    for (let j = 0; j <= ny; j++) for (let i = 0; i <= nx; i++) {
      const r = exact([x0 + i * sx, y0 + j * sy]);
      lat[j * (nx + 1) + i] = r[0]; lng[j * (nx + 1) + i] = r[1];
    }
    return (p) => {
      const x = p[0], y = p[1];
      if (x < x0 || x > x1 || y < y0 || y > y1) return exact(p);
      let fx = sx ? (x - x0) / sx : 0, fy = sy ? (y - y0) / sy : 0;
      let i = Math.min(nx - 1 < 0 ? 0 : nx - 1, Math.floor(fx)), j = Math.min(ny - 1 < 0 ? 0 : ny - 1, Math.floor(fy));
      fx -= i; fy -= j;
      const k = j * (nx + 1) + i, k2 = k + (nx + 1);
      const i1 = nx > 0 && sx ? 1 : 0, j1 = ny > 0 && sy ? (nx + 1) : 0;
      const a = lat[k] * (1 - fx) + lat[k + i1] * fx, b = lat[k + j1] * (1 - fx) + lat[k + j1 + i1] * fx;
      const c = lng[k] * (1 - fx) + lng[k + i1] * fx, d = lng[k + j1] * (1 - fx) + lng[k + j1 + i1] * fx;
      return [a * (1 - fy) + b * fy, c * (1 - fy) + d * fy];
    };
  }

  function describe(mode, lon0) {
    switch (mode) {
      case 'vn3': return 'VN-2000 múi 3°, KTT ' + fmtDeg(lon0);
      case 'vn6': return 'VN-2000 múi 6°, KTT ' + fmtDeg(lon0);
      case 'utm48': return 'WGS84 UTM 48N';
      case 'utm49': return 'WGS84 UTM 49N';
      case 'wkt': return 'Theo .prj';
      default: return 'WGS84 (độ)';
    }
  }
  function fmtDeg(d) { const a = Math.floor(d), m = Math.round((d - a) * 60); return a + '°' + String(m).padStart(2, '0') + "'"; }

  /** WGS84 [lat,lng] -> VN-2000 [x(Bắc), y(Đông)] theo cách ghi của ngành địa chính */
  function toVN2000(lat, lng, lon0, k) {
    const r = proj4('WGS84', vn2000(lon0, k || 0.9999), [lng, lat]);
    return { E: r[0], N: r[1] };
  }

  function vnWkt(lon0) {
    return 'PROJCS["VN_2000_TM3_KTT_' + lon0 + '",GEOGCS["GCS_VN_2000",DATUM["D_Vietnam_2000",SPHEROID["WGS_1984",6378137.0,298.257223563]],PRIMEM["Greenwich",0.0],UNIT["Degree",0.0174532925199433]],' +
      'PROJECTION["Transverse_Mercator"],PARAMETER["False_Easting",500000.0],PARAMETER["False_Northing",0.0],PARAMETER["Central_Meridian",' + lon0 + '],PARAMETER["Scale_Factor",0.9999],PARAMETER["Latitude_Of_Origin",0.0],UNIT["Meter",1.0]]';
  }
  function wgsWkt() {
    return 'GEOGCS["GCS_WGS_1984",DATUM["D_WGS_1984",SPHEROID["WGS_1984",6378137.0,298.257223563]],PRIMEM["Greenwich",0.0],UNIT["Degree",0.0174532925199433]]';
  }

  global.CRS = { PROVINCES, BBOX, detectLon0, provinceNames, makeTransform, fromPrj, toVN2000, describe, fmtDeg, vnWkt, wgsWkt };
})(window);

  <script>/*
 * Chuẩn hóa thực thể CAD (DXF / DWG / DGN) về một dạng chung rồi "explode"
 * (bung block, tính cung tròn, bulge) thành danh sách đối tượng theo tọa độ gốc của file.
 *
 * Dạng chung:
 *  {t:'line', pts:[[x,y]..], closed}
 *  {t:'circle', c:[x,y], r}
 *  {t:'arc', c, r, a0, a1}            (radian, ngược chiều kim đồng hồ)
 *  {t:'ellipse', c, major:[dx,dy], ratio, a0, a1}
 *  {t:'text', p, text, h, rot}
 *  {t:'point', p}
 *  {t:'insert', name, p, sx, sy, rot}
 *  + layer, color
 */
(function (global) {
  'use strict';

  // ---------- Bảng màu AutoCAD (ACI) ----------
  const ACI = (function () {
    const t = [];
    const base = ['#000000', '#ff0000', '#ffff00', '#00ff00', '#00ffff', '#0000ff', '#ff00ff', '#ffffff', '#414141', '#808080'];
    for (let i = 0; i < 10; i++) t[i] = base[i];
    const vals = [1, 1, 0.8, 0.8, 0.6, 0.6, 0.5, 0.5, 0.3, 0.3];
    for (let i = 10; i < 250; i++) {
      const hue = Math.floor((i - 10) / 10) * 15;
      const k = i % 10;
      const v = vals[k], s = k % 2 === 0 ? 1 : 0.5;
      t[i] = hsv(hue, s, v);
    }
    const grays = [51, 91, 132, 173, 214, 255];
    for (let i = 250; i < 256; i++) { const g = grays[i - 250].toString(16).padStart(2, '0'); t[i] = '#' + g + g + g; }
    return t;
  })();
  function hsv(h, s, v) {
    const f = (n) => { const k = (n + h / 60) % 6; return v - v * s * Math.max(Math.min(k, 4 - k, 1), 0); };

        let glueText = await glueResp.text();

        // Patch glue code: thay import.meta.url bằng URL CDN thực
        // để emscripten tính đúng scriptDirectory (dù chạy từ blob URL)

          JSON.stringify(base + '/wasm/libredwg-web.js'));

          /import\s*\(\s*["']\.\//g,

      + '• Kiểm tra kết nối Internet (cần tải thư viện ~5 MB lần đầu).\n'

  async function dwg(name, buf, progress) {

  <script>/*
 * Lớp vẽ nhanh bằng 1 canvas duy nhất + chỉ mục lưới không gian.
 * Thay cho việc tạo hàng trăm nghìn đối tượng Leaflet riêng lẻ: nạp nhanh, kéo/zoom mượt,

(function () {

  /**

  // Duyệt các đối tượng có thể nằm trong khung [x0,y0,x1,y1] (mét Mercator)

    } else {

    html += '<div class="btnrow"><button id="cvZoom">Xem trên bản đồ</button><button id="cvCsv">Lưu CSV</button><button class="primary" id="cvDxf">Xuất CAD (DXF) cắm mốc</button><button id="cvCopy">Sao chép</button></div>';
    box.innerHTML = html;
    C.openSheet('Bảng tọa độ', box);
    const name = safeName(Ly.name) + '_thua' + (lb.thua !== '' && lb.thua != null ? safeName(lb.thua) : fi + 1);
    box.querySelector('#cvZoom').onclick = () => { C.closeSheet(); C.select(Ly, [fi], true); };
    box.querySelector('#cvCsv').onclick = () => doSave(name + '.csv', coordCsv(Ly, [fi]), 'text/csv');
    box.querySelector('#cvDxf').onclick = () => doSave(name + '.dxf', buildDxf(Ly, [fi]).text, 'application/dxf');
    box.querySelector('#cvCopy').onclick = () => {
      const txt = coordCsv(Ly, [fi]).replace(/^﻿/, '').replace(/,/g, '\t');
      try { navigator.clipboard.writeText(txt).then(() => C.toast('Đã sao chép bảng tọa độ'), () => C.toast('Không sao chép được', true)); } catch (e) { C.toast('Không sao chép được', true); }
    };
  }

  // ---------- Tra cứu ----------
  function showSearch(startLy) {
    const lys = C.layers().filter(L0 => L0.features.some(f => f.kind !== 'text'));
    if (!lys.length) { C.toast('Chưa có dữ liệu. Hãy mở file Shapefile/GeoJSON/GDB/DGN/DWG trước.', true); return; }
    const box = document.createElement('div');
    box.innerHTML =
      '<div class="seg"><button class="on">Tờ · thửa · chủ</button><button id="segB">Tìm chữ</button><button id="segK">Kiểm kê</button></div>' +
      '<label class="f">Lớp dữ liệu</label><select id="qLy">' + lys.map(L0 => '<option value="' + L0.id + '"' + (startLy && startLy.id === L0.id ? ' selected' : '') + '>' + C.esc(L0.name) + ' (' + L0.type + ')</option>').join('') + '</select>' +
      '<div class="two"><div><label class="f">Số tờ</label><input type="text" id="qTo" inputmode="numeric" placeholder="vd: 12"></div><div><label class="f">Số thửa</label><input type="text" id="qThua" inputmode="numeric" placeholder="vd: 345"></div></div>' +
      '<label class="f">Tên chủ sử dụng / từ khóa bất kỳ</label><input type="text" id="qChu" placeholder="vd: Nguyễn Văn A, ONT, ...">' +
      '<div class="btnrow"><button class="primary" id="qGo">Tra cứu</button><button id="qTable">Mở bảng thuộc tính</button><button id="qMap">Gán cột</button></div>' +
      '<div id="qMsg" class="hint"></div><div id="qRes"></div>';
    C.openSheet('Tra cứu tờ · thửa · chủ', box);
    const $ = (id) => box.querySelector(id);
    const cur = () => lys.find(L0 => L0.id == $('#qLy').value);
    function run() {
      const Ly = cur(); if (!Ly) return;
      prepareForSearch(Ly);
      const g = guessFields(Ly);
      const to = $('#qTo').value.trim(), thua = $('#qThua').value.trim(), q = norm($('#qChu').value.trim());
      const recs = recordsOf(Ly, Ly.isCad);
      const res = [];
      const eq = (a, b) => String(a == null ? '' : a).trim().replace(/\.0+$/, '') === b;
      for (const r of recs) {
        const f = Ly.features[r.first], p = f.props || {};
        if (to && (!g.to || !eq(p[g.to], to))) continue;
        if (thua && (!g.thua || !eq(p[g.thua], thua))) continue;
        if (q) {
          let hit = false;
          const fields = g.chu ? [g.chu] : [];
          for (const k of Object.keys(p)) { if (INTERNAL.includes(k) || (!fields.includes(k) && g.chu && !/ten|chu|dia|dc|ghi/.test(key(k)) && q.length < 3)) continue; if (norm(p[k]).indexOf(q) >= 0) { hit = true; break; } }
          if (!hit) continue;
        }
        res.push(r);
        if (res.length >= 200) break;
      }
      let msg = res.length + ' kết quả' + (res.length >= 200 ? ' (hiện 200 đầu)' : '');
      if ((to && !g.to) || (thua && !g.thua)) msg += '. ⚠ Chưa nhận ra cột ' + (to && !g.to ? 'Số tờ' : 'Số thửa') + ' — bấm "Gán cột".';
      if (Ly.isCad && Ly.joinedCount != null) msg += '. (Số thửa/diện tích/loại đất ghép tự động từ nhãn trong ranh thửa: ' + Ly.joinedCount + ' nhãn)';
      $('#qMsg').textContent = msg;
      const out = $('#qRes'); out.innerHTML = '';
      res.forEach(r => {
        const f = Ly.features[r.first], l = featLabel(Ly, f);
        const row = document.createElement('div'); row.className = 'resrow';
        row.innerHTML = '<div class="rt">' + (l.to !== '' && l.to != null ? 'Tờ ' + C.esc(l.to) + ' · ' : '') + 'Thửa <b>' + C.esc(l.thua !== '' && l.thua != null ? l.thua : '#' + (r.first + 1)) + '</b>' + (l.loai ? ' · ' + C.esc(l.loai) : '') +
          (l.dt !== '' && l.dt != null ? ' · ' + C.esc(l.dt) + ' m²' : '') + '</div>' + (l.chu ? '<div class="rs">' + C.esc(l.chu) + '</div>' : '') +
          '<div class="ra"><button class="z">Xem</button><button class="c">Tọa độ</button><button class="e">Thuộc tính</button><button class="n">🚗</button></div>';
        row.querySelector('.z').onclick = () => { C.closeSheet(); C.select(Ly, r.fi, true); };
        row.querySelector('.n').onclick = () => {
          const p = FindNav.featCenter(Ly, r.fi);
          if (p) FindNav.navTo(p.lat, p.lng, (l.to !== '' && l.to != null ? 'Tờ ' + l.to + ' · ' : '') + 'Thửa ' + (l.thua !== '' && l.thua != null ? l.thua : '#' + (r.first + 1)));
        };
        row.querySelector('.c').onclick = () => showCoords(Ly, r.first);
        row.querySelector('.e').onclick = () => showTable(Ly, { only: r.first });
        out.appendChild(row);
      });
      Ly._lastResult = res;
    }
    $('#segB').onclick = () => FindNav.showTextSearch();
    $('#segK').onclick = () => showInventory(cur());
    $('#qGo').onclick = run;
    box.querySelectorAll('input[type=text]').forEach(i => i.addEventListener('keydown', e => { if (e.key === 'Enter') run(); }));
    $('#qTable').onclick = () => showTable(cur());
    $('#qMap').onclick = () => showMapping(cur(), () => showSearch(cur()));
  }

  function showMapping(Ly, back) {
    prepareForSearch(Ly);
    const g = guessFields(Ly), fs = [''].concat(fieldsOf(Ly));
    const box = document.createElement('div');
    const sel = (id, lab, v) => '<label class="f">' + lab + '</label><select id="' + id + '">' + fs.map(f => '<option value="' + C.esc(f) + '"' + (f === v ? ' selected' : '') + '>' + (f ? C.esc(f) : '— không có —') + '</option>').join('') + '</select>';
    box.innerHTML = sel('mTo', 'Cột Số tờ bản đồ', g.to) + sel('mThua', 'Cột Số thửa', g.thua) + sel('mChu', 'Cột Tên chủ sử dụng', g.chu) + sel('mLoai', 'Cột Loại đất', g.loai) + sel('mDt', 'Cột Diện tích', g.dt) +
      '<div class="btnrow"><button class="primary" id="mOk">Áp dụng</button></div>';
    C.openSheet('Gán cột tra cứu — ' + Ly.name, box);
    box.querySelector('#mOk').onclick = () => {
      Ly._guess = { to: box.querySelector('#mTo').value, thua: box.querySelector('#mThua').value, chu: box.querySelector('#mChu').value, loai: box.querySelector('#mLoai').value, dt: box.querySelector('#mDt').value };
      back && back();
    };
  }

  // ---------- Bảng thuộc tính ----------
  function showTable(Ly, opts) {
    opts = opts || {};
    prepareForSearch(Ly);
    const st = Ly._tbl || (Ly._tbl = { page: 0, filter: '', poly: !!Ly.isCad });
    st.only = opts.only != null ? opts.only : null;
    const PAGE = 1;
    const box = document.createElement('div');
    function render() {
      const fields = fieldsOf(Ly);
      let recs = recordsOf(Ly, st.only != null ? false : st.poly);
      if (st.only != null) recs = recs.filter(r => r.fi.includes(st.only));
      const nf = norm(st.filter);
      if (nf) recs = recs.filter(r => { const p = Ly.features[r.first].props || {}; for (const k of fields) if (norm(p[k]).indexOf(nf) >= 0) return true; return false; });
      if (opts.focus != null) { const idx = recs.findIndex(r => r.fi.includes(opts.focus)); if (idx >= 0) st.page = Math.floor(idx / PAGE); opts.focus = null; }
      const pages = Math.max(1, Math.ceil(recs.length / PAGE));
      st.page = Math.min(st.page, pages - 1);
      const slice = recs.slice(st.page * PAGE, st.page * PAGE + PAGE);
      let h = st.only != null ? '<div class="btnrow" style="margin-top:0"><button id="tAll">Xem tất cả thuộc tính của lớp</button></div>' : '';
      if (st.only == null) h += '<div class="tools"><input type="text" id="tFilter" placeholder="Lọc theo nội dung…" value="' + C.esc(st.filter) + '">' +
        (Ly.isCad ? '<label class="chk"><input type="checkbox" id="tPoly"' + (st.poly ? ' checked' : '') + '> Chỉ thửa (vùng khép kín)</label>' : '') + '</div>';
      h += '<div class="hint">' + recs.length + ' đối tượng' + (Ly.dirty ? ' · <b style="color:#ffd54a">đã chỉnh sửa</b>' : '') + ' · đối tượng ' + (st.page + 1) + '/' + pages + '</div>';
      slice.forEach(r => {
        const f = Ly.features[r.first], p = f.props || {};
        h += '<div class="frm" data-f="' + r.first + '"><div class="act"><button class="mini z">◎ Xem trên bản đồ</button><button class="mini c">XY Tọa độ</button></div>' +
          fields.map(k => '<label class="vf"><span>' + C.esc(k === 'layer' ? (Ly.type === 'DGN' ? 'Level' : 'Layer') : k) + '</span>' + (k === 'layer' && Ly.isCad ? '<div class="ro">' + C.esc(p[k]) + '</div>' : '<input class="cell" data-k="' + C.esc(k) + '" value="' + C.esc(p[k] == null ? '' : p[k]) + '">') + '</label>').join('') + '</div>';
      });
      h += '<div class="btnrow"><button id="tPrev">‹ Trước</button><button id="tNext">Sau ›</button><button id="tAddCol">＋ Cột</button><button class="primary" id="tExport">Lưu / Xuất ▾</button></div>';
      h += '<div id="tMenu" class="menu hidden"></div><div id="tAdd" class="hidden"><label class="f">Tên cột mới</label><input type="text" id="tColName" placeholder="vd: GHI_CHU"><div class="btnrow"><button class="primary" id="tColOk">Thêm</button></div></div>';
      box.innerHTML = h;
      const ta = box.querySelector('#tAll'); if (ta) ta.onclick = () => { st.only = null; opts.focus = recs[0] && recs[0].first; render(); };
      const tf = box.querySelector('#tFilter'); if (tf) tf.onchange = (e) => { st.filter = e.target.value; st.page = 0; render(); };
      const cp = box.querySelector('#tPoly'); if (cp) cp.onchange = (e) => { st.poly = e.target.checked; st.page = 0; render(); };
      box.querySelector('#tPrev').onclick = () => { if (st.page > 0) { st.page--; render(); } };
      box.querySelector('#tNext').onclick = () => { if (st.page < pages - 1) { st.page++; render(); } };
      box.querySelectorAll('.frm[data-f]').forEach(tr => {
        const fi = +tr.dataset.f;
        tr.querySelector('.z').onclick = () => { C.closeSheet(); C.select(Ly, recs.find(r => r.first === fi).fi, true); };
        tr.querySelector('.c').onclick = () => showCoords(Ly, fi);
        tr.querySelectorAll('input.cell').forEach(inp => inp.onchange = () => {
          const rec = recs.find(r => r.first === fi);
          const k = inp.dataset.k;
          rec.fi.forEach(i => {
            const f = Ly.features[i]; f.props = f.props || {};
            const old = f.props[k]; let v = inp.value;
            if (typeof old === 'number' && v.trim() !== '' && isFinite(+v.replace(',', '.'))) v = +v.replace(',', '.');
            f.props[k] = v;
          });
          Ly.dirty = true;
        });
      });
      box.querySelector('#tAddCol').onclick = () => { box.querySelector('#tAdd').classList.toggle('hidden'); };
      box.querySelector('#tColOk').onclick = () => {
        const nm = box.querySelector('#tColName').value.trim();
        if (!nm) return;
        if (fields.includes(nm)) { C.toast('Cột đã tồn tại', true); return; }
        Ly.features.forEach(f => { if (f.kind !== 'text') { f.props = f.props || {}; f.props[nm] = ''; } });
        Ly._fields = null; Ly.dirty = true; render();
      };
      box.querySelector('#tExport').onclick = () => {
        const m = box.querySelector('#tMenu');
        if (!m.classList.contains('hidden')) { m.classList.add('hidden'); return; }
        m.innerHTML =
          '<button data-a="shp">Lưu Shapefile (.zip) – có bảng đã sửa</button>' +
          '<button data-a="gj">Lưu GeoJSON (đã sửa)</button>' +
          '<button data-a="csv">Lưu bảng thuộc tính (CSV)</button>' +
          '<button data-a="dxfall">Xuất TẤT CẢ thửa → CAD (DXF) cắm mốc</button>' +
          '<button data-a="dxfsel">Xuất các thửa đang lọc → CAD (DXF)</button>' +
          '<button data-a="coords">Bảng tọa độ TẤT CẢ thửa (CSV)</button>';
        m.classList.remove('hidden');
        m.querySelectorAll('button').forEach(b => b.onclick = () => exportAction(Ly, b.dataset.a, recs, fields));
      };
    }
    render();
    C.openSheet('Bảng thuộc tính — ' + Ly.name, box);
  }

  function exportAction(Ly, a, filtered, fields) {
    const base = safeName(Ly.name) + '_' + stamp();
    const polyIdx = (recs) => recs.filter(r => Ly.features[r.first].kind === 'polygon').map(r => r.first);
    const allRecs = recordsOf(Ly, false);
    try {
      if (a === 'shp') {
        const prj = Ly.prjText || (Ly.crs && Ly.crs.mode === 'vn3' ? CRS.vnWkt(Ly.crs.lon0) : (Ly.crs && Ly.crs.mode === 'wgs84' ? CRS.wgsWkt() : null));
        const feats = Ly.features.filter(f => f.kind !== 'text');
        const zip = Export.shapefileZip(safeName(Ly.name), feats, { prj });
        doSave(base + '_shp.zip', zip, 'application/zip');
      } else if (a === 'gj') {
        doSave(base + '.geojson', Export.geojson(Ly.features.filter(f => f.kind !== 'text'), Ly.P), 'application/geo+json');
      } else if (a === 'csv') {
        const rows = [fields];
        allRecs.forEach(r => { const p = Ly.features[r.first].props || {}; rows.push(fields.map(k => p[k])); });
        doSave(base + '.csv', Export.csv(rows), 'text/csv');
      } else if (a === 'dxfall' || a === 'dxfsel') {
        const idx = polyIdx(a === 'dxfall' ? allRecs : filtered);
        const use = idx.length ? idx : (a === 'dxfall' ? allRecs : filtered).map(r => r.first);
        if (!use.length) { C.toast('Không có thửa nào để xuất.', true); return; }
        C.loading(true, 'Đang tạo file CAD (' + use.length + ' đối tượng)…');
        setTimeout(() => {
          try { doSave(base + '_camMoc.dxf', buildDxf(Ly, use).text, 'application/dxf'); } finally { C.loading(false); }
        }, 30);
      } else if (a === 'coords') {
        const idx = polyIdx(allRecs);
        doSave(base + '_toado.csv', coordCsv(Ly, idx.length ? idx : allRecs.map(r => r.first)), 'text/csv');
      }
    } catch (e) { C.loading(false); C.toast('Lỗi xuất: ' + e.message, true); }
  }

  // ---------- Kiểm kê thửa đất ----------
  function showInventory(startLy) {
    const lys = C.layers().filter(L0 => L0.features.some(f => f.kind !== 'text'));
    if (!lys.length) { C.toast('Chưa có dữ liệu. Hãy mở file Shapefile/GeoJSON/GDB/DGN/DWG trước.', true); return; }
    const box = document.createElement('div');
    let curFilter = 'all', qTxt = '';
    const $ = (id) => box.querySelector(id);
    box.innerHTML =
      '<div class="seg"><button id="segA">Tờ · thửa · chủ</button><button id="segB">Tìm chữ</button><button class="on">Kiểm kê</button></div>' +
      '<label class="f">Lớp dữ liệu</label><select id="kLy">' + lys.map(L0 => '<option value="' + L0.id + '"' + (startLy && startLy.id === L0.id ? ' selected' : '') + '>' + C.esc(L0.name) + ' (' + L0.type + ')</option>').join('') + '</select>' +
      '<div id="kStats" class="inv-stats"></div>' +
      '<div id="kChips" class="inv-chips"></div>' +
      '<div class="find-row" style="margin:6px 0"><input type="text" id="kQ" placeholder="Lọc số tờ, số thửa, tên chủ, ghi chú…"></div>' +
      '<div class="btnrow" style="margin:6px 0 8px"><button class="primary" id="kCsv">⬇ Xuất CSV kiểm kê</button><button id="kShp">⬇ Shapefile (.zip)</button><button id="kGj">⬇ GeoJSON</button></div>' +
      '<div id="kMsg" class="hint"></div><div id="kRes"></div>';
    C.openSheet('📋 Theo dõi kiểm kê', box);
    const cur = () => lys.find(L0 => L0.id == $('#kLy').value);
    function draw() {
      const Ly = cur(); if (!Ly) return;
      prepareForSearch(Ly);
      const recs = recordsOf(Ly, Ly.isCad);
      let done = 0, todo = 0;
      const byStatus = {};
      for (const r of recs) {
        const f = Ly.features[r.first], p = f.props || {};
        const st = (p.KIEM_KE || '').trim();
        const col = f.markColor || '';
        if (st || col) {
          done++;
          const keySt = st || col;
          if (!byStatus[keySt]) byStatus[keySt] = { n: 0, c: col || '#22c55e' };
          byStatus[keySt].n++;
        } else todo++;
      }
      const total = recs.length;
      const pct = total ? Math.round(done * 100 / total) : 0;
      $('#kStats').innerHTML = 'Tổng: <b>' + total + '</b> thửa · Đã kiểm kê: <b style="color:#22c55e">' + done + '</b> (' + pct + '%) · Chưa xong: <b style="color:#ffd54a">' + todo + '</b>';
      const chips = [
        { k: 'all', label: 'Tất cả (' + total + ')', c: '' },
        { k: 'todo', label: 'Chưa kiểm kê (' + todo + ')', c: '' }
      ];
      Object.keys(byStatus).forEach(k => chips.push({ k, label: k + ' (' + byStatus[k].n + ')', c: byStatus[k].c }));
      $('#kChips').innerHTML = chips.map(ch =>
        '<button class="inv-chip' + (curFilter === ch.k ? ' on' : '') + '" data-k="' + C.esc(ch.k) + '">' +
        (ch.c ? '<i style="background:' + C.esc(ch.c) + '"></i>' : '') + C.esc(ch.label) + '</button>'
      ).join('');
      $('#kChips').querySelectorAll('.inv-chip').forEach(b => b.onclick = () => { curFilter = b.dataset.k; draw(); });

      const nq = norm(qTxt);
      const list = [];
      for (const r of recs) {
        const f = Ly.features[r.first], p = f.props || {};
        const st = (p.KIEM_KE || '').trim(), col = f.markColor || '', note = (p.GHI_CHU_KK || '').trim();
        const keySt = st || col;
        if (curFilter === 'todo' && keySt) continue;
        if (curFilter !== 'all' && curFilter !== 'todo' && keySt !== curFilter) continue;
        if (nq) {
          const l = featLabel(Ly, f);
          const hay = norm([l.to, l.thua, l.chu, l.loai, st, note].join(' '));
          if (hay.indexOf(nq) < 0) continue;
        }
        list.push(r);
        if (list.length >= 200) break;
      }
      $('#kMsg').textContent = 'Hiển thị ' + list.length + ' thửa' + (list.length >= 200 ? ' (200 đầu)' : '') + ' · Cột tự động trong dữ liệu: KIEM_KE, GHI_CHU_KK';
      const out = $('#kRes'); out.innerHTML = '';
      list.forEach(r => {
        const f = Ly.features[r.first], p = f.props || {}, l = featLabel(Ly, f);
        const st = (p.KIEM_KE || '').trim(), col = f.markColor || '', note = (p.GHI_CHU_KK || '').trim();
        const row = document.createElement('div'); row.className = 'resrow';
        row.innerHTML =
          '<div class="rt">' + (l.to !== '' && l.to != null ? 'Tờ ' + C.esc(l.to) + ' · ' : '') + 'Thửa <b>' + C.esc(l.thua !== '' && l.thua != null ? l.thua : '#' + (r.first + 1)) + '</b>' +
          (l.loai ? ' · ' + C.esc(l.loai) : '') + (l.dt !== '' && l.dt != null ? ' · ' + C.esc(l.dt) + ' m²' : '') +
          (st || col ? ' <span class="inv-badge" style="background:' + C.esc(col || '#22c55e') + '">' + C.esc(st || 'Đã đánh dấu') + '</span>' : '') +
          '</div>' +
          (l.chu ? '<div class="rs">' + C.esc(l.chu) + '</div>' : '') +
          (note ? '<div class="rs" style="color:#ffd54a">📝 ' + C.esc(note) + '</div>' : '') +
          '<div class="ra"><button class="z">Xem</button><button class="e">Thuộc tính</button><button class="n">🚗</button></div>';
        row.querySelector('.z').onclick = () => { C.closeSheet(); C.select(Ly, r.fi, true); };
        row.querySelector('.e').onclick = () => showTable(Ly, { only: r.first });
        row.querySelector('.n').onclick = () => {
          const pt = FindNav.featCenter(Ly, r.fi);
          if (pt) FindNav.navTo(pt.lat, pt.lng, (l.to !== '' && l.to != null ? 'Tờ ' + l.to + ' · ' : '') + 'Thửa ' + (l.thua !== '' && l.thua != null ? l.thua : '#' + (r.first + 1)));
        };
        out.appendChild(row);
      });
    }
    $('#segA').onclick = () => showSearch(cur());
    $('#segB').onclick = () => FindNav.showTextSearch();
    $('#kLy').onchange = () => { curFilter = 'all'; draw(); };
    $('#kQ').oninput = (e) => { qTxt = e.target.value; draw(); };
    $('#kCsv').onclick = () => {
      const Ly = cur(); if (!Ly) return;
      const fields = fieldsOf(Ly);
      exportAction(Ly, 'csv', recordsOf(Ly, false), fields);
    };
    $('#kShp').onclick = () => { const Ly = cur(); if (Ly) exportAction(Ly, 'shp', [], fieldsOf(Ly)); };
    $('#kGj').onclick = () => { const Ly = cur(); if (Ly) exportAction(Ly, 'gj', [], fieldsOf(Ly)); };

  <script>/*
 * Xem lùi thời gian ảnh vệ tinh – dùng kho ảnh lưu trữ Esri World Imagery Wayback (2014 → nay).
 * - Chỉ liệt kê các mốc mà ảnh TẠI VỊ TRÍ ĐANG XEM thực sự thay đổi (dịch vụ tilemap của Wayback).

(function (global) {
  'use strict';
  const CONFIG_URL = 'https://s3-us-west-2.amazonaws.com/config.maptiles.arcgis.com/waybackconfig.json';

  const $ = (id) => document.getElementById(id);

  async function loadConfig() {
    if (releases) return releases;

      const c = JSON.parse(localStorage.getItem('waybackCfg') || 'null');

      '<button id="tbNext" aria-label="Mới hơn">▶</button></div>' +
      '<div id="tbChips" class="tb-chips"></div>' +
      '<div class="tb-row"><button id="tbCompare">⇆ So sánh</button><button id="tbReload">↻ Tìm tại đây</button>' +
      '<label class="tb-op">Độ mờ <input type="range" id="tbOpacity" min="20" max="100" value="100"></label><button id="tbClose">✕</button></div>';

    document.body.appendChild(sw);

    $('tbPrev').onclick = () => select(idx + 1);

  function renderChips() {

  async function select(i) {

    } else $('tbMeta').textContent = 'Không rõ ngày chụp (hiển thị ngày phát hành)';
  }

  async function refresh(force) {
    const t = centerTile();
    const key = t.z + '/' + t.x + '/' + t.y;
    if (!force && key === lastKey) return;
    lastKey = key;
    const my = ++searching;
    $('tbMeta').textContent = 'Đang tìm các mốc ảnh tại vị trí này…';
    try {
      const keepDate = versions[idx] ? versions[idx].date : null;
      const vs = await findVersions();
      if (my !== searching || !active) return;
      if (!vs.length) { versions = []; $('tbChips').innerHTML = ''; $('tbDate').textContent = 'Không có ảnh lưu trữ tại đây'; $('tbMeta').textContent = ''; return; }
      versions = vs;
      // giữ mốc gần nhất với mốc đang xem; lần đầu chọn mốc cũ thứ 2 (để thấy khác biệt)
      let pick = vs.length > 1 ? 1 : 0;
      if (keepDate) {
        let best = Infinity;
        vs.forEach((v, i) => { const d = Math.abs(Date.parse(v.date) - Date.parse(keepDate)); if (d < best) { best = d; pick = i; } });
      }
      select(pick);

      if (my === searching) { $('tbMeta').textContent = 'Lỗi kết nối kho ảnh lịch sử: ' + e.message; ctx.toast('Không tải được ảnh lịch sử. Kiểm tra kết nối Internet.', true); }
    }
  }

  function clip() {
    if (!layer) return;
    const el = layer.getContainer();
    if (!el) return;
    const swEl = $('swipe');
    if (!compare) { el.style.clip = ''; swEl.classList.add('hidden'); return; }
    swEl.classList.remove('hidden');
    const size = map.getSize();
    const nw = map.containerPointToLayerPoint([0, 0]);
    const se = map.containerPointToLayerPoint(size);
    const x = nw.x + size.x * divX;
    el.style.clip = 'rect(' + [nw.y, x, se.y, nw.x].map(v => v + 'px').join(',') + ')';
    swEl.style.left = (size.x * divX) + 'px';
  }

  function setCompare(on) {
    compare = on;
    $('tbCompare').classList.toggle('on', on);
    $('tbOpacity').value = 100; if (layer) layer.setOpacity(1);
    clip();
  }

  async function toggle(on) {
    active = on == null ? !active : on;
    $('btnTime').classList.toggle('on', active);
    $('timeBar').classList.toggle('hidden', !active);
    document.body.classList.toggle('time-on', active);
    if (active) {
      if (map.getZoom() < 12) ctx.toast('Phóng to tới khu vực cần xem (mức xã/phường) để tìm đủ các mốc ảnh.', false, 5000);
      lastKey = '';
      refresh(true);
    } else {
      searching++;
      setCompare(false);
      if (layer) { map.removeLayer(layer); layer = null; }
      versions = []; idx = -1;
    }
  }

  function init(c) {
    ctx = c; map = c.map;
    buildUI();
    $('btnTime').onclick = () => toggle();
    map.on('move zoom', clip);
    map.on('moveend', () => { if (active) { clearTimeout(init._t); init._t = setTimeout(() => refresh(false), 700); } });
  }

  global.Wayback = { init, toggle };
})(window);
</script>

  }

  // ---------- Tự khép ranh thành thửa ----------
  const AUTO_LV = 'Thửa tự khép';
  const lvNorm = (n) => String(n).replace(/^\s*level\s*/i, '').trim();
  function closeLevelSet() { return new Set(String(S.closeLevels || '').split(/[\s,;]+/).map(lvNorm).filter(Boolean)); }
  /** Ghép các đoạn ranh trên các Level đã chọn thành thửa khép kín (đối tượng đánh dấu f.auto, không vẽ nét, chỉ để chạm chọn). */
  function autoClose(Ly, levels, tol) {

    if (!want.size || !window.Polygonize) { Ly.closeStats = null; Ly.closeUsed = null; return null; }
    const res = Polygonize.run(Ly.features, (f) => f.props && f.props.layer != null && want.has(lvNorm(f.props.layer)), tol || S.closeTol || 0.1);
    for (const p of res.polys) Ly.features.push({ kind: 'polygon', pts: orderRing(p.ring), holes: p.holes.length ? p.holes : undefined, props: { layer: AUTO_LV }, auto: true });
    Ly.closeStats = res.stats;

    if (res.polys.length) Ly.note = (Ly.note ? Ly.note + '\n' : '') + 'Tự khép ranh (Level ' + Array.from(want).join(', ') + '): ' + res.polys.length + ' thửa';

  }
  /** Sắp đỉnh theo chiều kim đồng hồ, bắt đầu từ đỉnh góc Tây Bắc (như trích lục thửa đất). */

  function rerunClose(Ly, levels, tol) {

  // ========== Kiểm kê – màu đánh dấu thửa ==========

  const MARK_COLORS = [

    { c: '#eab308', l: 'Đang xử lý',   n: 'Vàng – Đang xử lý',      h: 'bdiag' },
    { c: '#f97316', l: 'Chờ bổ sung',   n: 'Cam – Chờ bổ sung',      h: 'cross' },
    { c: '#ef4444', l: 'Cần kiểm tra',  n: 'Đỏ – Cần kiểm tra',      h: 'horiz' },
    { c: '#3b82f6', l: 'Đã đo đạc',    n: 'Xanh dương – Đã đo đạc',  h: 'vert' },
    { c: '#a855f7', l: 'Tím',           n: 'Tím',                      h: 'grid' },
    { c: '#ec4899', l: 'Hồng',          n: 'Hồng',                     h: 'diaggrid' },
    { c: '#06b6d4', l: 'Cyan',          n: 'Xanh ngọc',                h: 'dots' },

  /** Tạo CanvasPattern cho hatch. Trả về pattern hoặc null. */
  const _hatchCache = {};

      case 'horiz': return 'background:repeating-linear-gradient(0deg,' + col + ' 0,' + col + ' 2px,' + w + ' 2px,' + w + ' 5px)';
      case 'vert': return 'background:repeating-linear-gradient(90deg,' + col + ' 0,' + col + ' 2px,' + w + ' 2px,' + w + ' 5px)';
      case 'grid': return 'background:repeating-linear-gradient(0deg,' + col + ' 0,' + col + ' 1.5px,transparent 1.5px,transparent 4px),repeating-linear-gradient(90deg,' + col + ' 0,' + col + ' 1.5px,' + w + ' 1.5px,' + w + ' 4px)';
      case 'diaggrid': return 'background:repeating-linear-gradient(45deg,' + col + ' 0,' + col + ' 1px,transparent 1px,transparent 4px),repeating-linear-gradient(-45deg,' + col + ' 0,' + col + ' 1px,' + w + ' 1px,' + w + ' 4px)';

  }
  function refreshCount() { $('layerCount').textContent = layers.length; }

  // Chọn (tô sáng) đối tượng và phóng tới
  let selLy = null;
  function select(Ly, fis, zoom) {
    layers.forEach(l => { if (l.fast && l !== Ly) l.fast.setSelection(null); });
    selLy = Ly;
    Ly.fast.setSelection(fis);
    setTimeout(() => Ly.fast.redraw(), 600);
    if (zoom && fis.length) {
      const d = Ly.data;
      let x0 = Infinity, y0 = Infinity, x1 = -Infinity, y1 = -Infinity;
      fis.forEach(i => { if (d.fKind[i] === 3) return; x0 = Math.min(x0, d.fBox[i * 4]); y0 = Math.min(y0, d.fBox[i * 4 + 1]); x1 = Math.max(x1, d.fBox[i * 4 + 2]); y1 = Math.max(y1, d.fBox[i * 4 + 3]); });
      if (isFinite(x0)) {
        const b = L.latLngBounds([L.FastLayer.unY(y0), L.FastLayer.unX(x0)], [L.FastLayer.unY(y1), L.FastLayer.unX(x1)]);
        map.fitBounds(b, { padding: [60, 60], maxZoom: 21 });
      } else toast('Đối tượng không có hình học.', true);
    }
  }

  // ---------- Thông tin đối tượng ----------
  function planar(pts) {
    let a = 0, per = 0;
    for (let i = 0; i < pts.length; i++) {
      const p = pts[i], q = pts[(i + 1) % pts.length];
      a += p[0] * q[1] - q[0] * p[1];
      per += Math.hypot(q[0] - p[0], q[1] - p[1]);
    }
    return { area: Math.abs(a) / 2, per };
  }
  function lineLen(pts) { let l = 0; for (let i = 1; i < pts.length; i++) l += Math.hypot(pts[i][0] - pts[i - 1][0], pts[i][1] - pts[i - 1][1]); return l; }
  function metricPts(Ly, pts) {
    if (Ly.crs.mode !== 'wgs84' && Ly.crs.mode !== 'wkt' && Ly.crs.mode !== 'utm48' && Ly.crs.mode !== 'utm49') return pts;
    return pts.map(p => { const ll = Ly.P(p); const r = CRS.toVN2000(ll[0], ll[1], S.lon0); return [r.E, r.N]; });
  }

  Attr.init({ layers: () => layers, S, map, openSheet, closeSheet, toast, esc, fmt, loading, select });
  FindNav.init({ layers: () => layers, S, map, openSheet, closeSheet, toast, esc, fmt, select });

  // Giữ tay (hoặc chuột phải) lên bản đồ: dẫn đường tới điểm đó
  map.on('contextmenu', (ev) => {
    if (measuring) return;
    const ll = ev.latlng;
    const vn = CRS.toVN2000(ll.lat, ll.lng, S.lon0);
    const box = document.createElement('div');
    box.style.cssText = 'font-size:13px;line-height:1.5';
    box.innerHTML = '<b>📍 Vị trí bấm chọn</b><br>' +
      'Vĩ độ: <b>' + ll.lat.toFixed(7) + '</b><br>' +
      'Kinh độ: <b>' + ll.lng.toFixed(7) + '</b><br>' +
      '<span style="color:#aaa">VN-2000 (KTT ' + CRS.fmtDeg(S.lon0) + ')</span><br>' +
      'X (Bắc): <b>' + fmt(vn.N, 3) + '</b><br>' +
      'Y (Đông): <b>' + fmt(vn.E, 3) + '</b><br>' +
      '<div class="pbtn" style="margin-top:6px"><button class="pn" style="font-size:12px">🚗 Dẫn đường tới đây</button></div>';
    box.querySelector('.pn').onclick = () => { map.closePopup(); FindNav.navTo(ll.lat, ll.lng, 'Điểm đã chọn trên bản đồ'); };
    L.popup({ maxWidth: 280 }).setLatLng(ll).setContent(box).openOn(map);
  });

  map.on('click', (ev) => {
    if (measuring) return;
    for (let k = layers.length - 1; k >= 0; k--) {
      const Ly = layers[k];
      if (!Ly.visible || !Ly.fast) continue;
      const i = Ly.fast.hit(ev.latlng, 12);
      if (i >= 0) { showFeature(Ly, i, ev.latlng); return; }
    }
    layers.forEach(l => l.fast && l.fast.setSelection(null));
    closeInfo();
    // Hiện tọa độ tại điểm bấm (khi không trúng thửa đất nào)
    const ll = ev.latlng;
    const vn = CRS.toVN2000(ll.lat, ll.lng, S.lon0);
    const box = document.createElement('div');
    box.style.cssText = 'font-size:13px;line-height:1.5';
    box.innerHTML = '<b>📍 Vị trí bấm chọn</b><br>' +
      'Vĩ độ: <b>' + ll.lat.toFixed(7) + '</b><br>' +
      'Kinh độ: <b>' + ll.lng.toFixed(7) + '</b><br>' +
      '<span style="color:#aaa">VN-2000 (KTT ' + CRS.fmtDeg(S.lon0) + ')</span><br>' +
      'X (Bắc): <b>' + fmt(vn.N, 3) + '</b><br>' +
      'Y (Đông): <b>' + fmt(vn.E, 3) + '</b><br>' +
      '<div class="pbtn" style="margin-top:6px"><button class="pn" style="font-size:12px">🚗 Dẫn đường tới đây</button></div>';
    box.querySelector('.pn').onclick = () => { map.closePopup(); FindNav.navTo(ll.lat, ll.lng, 'Điểm đã chọn trên bản đồ'); };
    L.popup({ maxWidth: 280 }).setLatLng(ll).setContent(box).openOn(map);
  });

  // ---------- Số đỉnh + chiều dài cạnh của đối tượng đang chọn ----------
  let geomLabels = null, geomSel = null;
  function clearGeomLabels() { if (geomLabels) { map.removeLayer(geomLabels); geomLabels = null; } geomSel = null; }
  function showGeomLabels(Ly, f) {
    if (geomLabels) { map.removeLayer(geomLabels); geomLabels = null; }
    geomSel = { Ly, f };
    if (!showEdges && !showVerts) return; // cả hai tắt → không vẽ gì
    if (f.kind !== 'polygon' && f.kind !== 'line') return;
    let pts = f.pts.slice();
    const closed = f.kind === 'polygon';
    if (closed && pts.length > 1 && pts[0][0] === pts[pts.length - 1][0] && pts[0][1] === pts[pts.length - 1][1]) pts.pop();
    if (pts.length < 2 || pts.length > 400) return;
    const lls = pts.map(p => { const ll = Ly.P(p); return L.latLng(ll[0], ll[1]); });
    const pr = lls.map(ll => map.options.crs.project(ll)); // mét Mercator, y hướng Bắc
    const px = lls.map(ll => map.latLngToContainerPoint(ll));
    const mp = metricPts(Ly, pts);
    const n = pts.length;
    let cx = 0, cy = 0, sa = 0;
    pr.forEach((p, i) => { cx += p.x; cy += p.y; const q = pr[(i + 1) % n]; sa += p.x * q.y - q.x * p.y; });
    cx /= n; cy /= n;
    const g = L.layerGroup();
    // Cạnh (chiều dài)
    if (showEdges) {
      const nE = closed ? n : n - 1;
      for (let i = 0; i < nE; i++) {
        const j = (i + 1) % n, p = pr[i], q = pr[j];
        const len = Math.hypot(mp[j][0] - mp[i][0], mp[j][1] - mp[i][1]);
        if (!(len > 0)) continue;
        const txt = fmt(len, 1) + ' m';
        if (px[i].distanceTo(px[j]) < txt.length * 5.5) continue;
        const dx = q.x - p.x, dy = q.y - p.y, d = Math.hypot(dx, dy) || 1;
        let ang = -Math.atan2(dy, dx) * 180 / Math.PI;
        if (ang > 90) ang -= 180; else if (ang < -90) ang += 180;
        const s = closed ? (sa > 0 ? -1 : 1) : 1;
        const ox = -dy / d * s * 11, oy = dx / d * s * 11;
        const mid = map.options.crs.unproject(L.point((p.x + q.x) / 2, (p.y + q.y) / 2));
        g.addLayer(L.marker(mid, { interactive: false, keyboard: false, icon: L.divIcon({ className: 'gl-icon', iconSize: [0, 0], html: '<span class="ed-lab" style="transform:translate(-50%,-50%) translate(' + ox.toFixed(1) + 'px,' + (-oy).toFixed(1) + 'px) rotate(' + ang.toFixed(1) + 'deg)">' + txt + '</span>' }) }));
      }
    }
    // Đỉnh (số thứ tự + chấm tròn)
    if (showVerts) {
      let lastPx = null;
      for (let i = 0; i < n; i++) {
        g.addLayer(L.circleMarker(lls[i], { radius: 3, color: '#ff1744', weight: 1.5, fillColor: '#fff', fillOpacity: 1, interactive: false }));
        if (lastPx && lastPx.distanceTo(px[i]) < 22) continue;
        lastPx = px[i];
        let ux = pr[i].x - cx, uy = pr[i].y - cy; const d = Math.hypot(ux, uy) || 1; ux /= d; uy /= d;
        g.addLayer(L.marker(lls[i], { interactive: false, keyboard: false, icon: L.divIcon({ className: 'gl-icon', iconSize: [0, 0], html: '<span class="vx-lab" style="transform:translate(-50%,-50%) translate(' + (ux * 17).toFixed(1) + 'px,' + (-uy * 17).toFixed(1) + 'px)">' + (i + 1) + '</span>' }) }));
      }
      if (closed) {
        try { const c = Attr.labelPoint(pts.map(q => ({ E: q[0], N: q[1] }))); const ll = Ly.P([c.E, c.N]); g.addLayer(L.circleMarker(ll, { radius: 7, stroke: false, fillColor: '#ff1744', fillOpacity: 1, interactive: false })); } catch (e) { }
      }
    }
    geomLabels = g.addTo(map);
  }
  map.on('zoomend', () => { if (geomSel) showGeomLabels(geomSel.Ly, geomSel.f); });

  // ---------- Khung thông tin thửa (dưới đáy màn hình) ----------
  const pick = (o, keys) => { for (const k of Object.keys(o)) { if (keys.includes(k.toLowerCase().replace(/[^a-z0-9]/g, ''))) { const v = o[k]; if (v != null && v !== '') return v; } } return ''; };
  function closeInfo() {
    $('fInfo').classList.add('hidden');
    clearGeomLabels();
    if (selLy && selLy.fast) selLy.fast.setSelection(null);
  }
  function showFeature(Ly, i, latlng) {
    const f = Ly.features[i];
    map.closePopup();
    select(Ly, f.rid != null ? Ly.features.map((g, j) => g.rid === f.rid && g.kind === f.kind ? j : -1).filter(j => j >= 0).slice(0, 50) : [i], false);
    const props = f.props || {};
    const to = pick(props, ['soto', 'shbando', 'sobando', 'tobando', 'tobd', 'sotobd', 'shto']);
    const thua = pick(props, ['sothua', 'shthua', 'thua', 'sothututhua', 'parcel', 'parcelno']);
    const loai = pick(props, ['loaidat', 'mdsd', 'kyhieumdsd', 'maloaidat', 'loaidatht', 'kyhieuloaidat']);
    const dtGhi = pick(props, ['dientich', 'dtpl', 'dientichphaply', 'dt', 'dientichht']);
    const chu = pick(props, ['tenchu', 'chusd', 'tenchusd', 'chusudung', 'hoten']);
    let area = null, per = null, nv = 0, len = null;
    if (f.kind === 'polygon') {
      const r = planar(metricPts(Ly, f.pts)); area = r.area; per = r.per;
      (f.holes || []).forEach(h => { area -= planar(metricPts(Ly, h)).area; });
      nv = f.pts.length - (f.pts.length > 1 && f.pts[0][0] === f.pts[f.pts.length - 1][0] && f.pts[0][1] === f.pts[f.pts.length - 1][1] ? 1 : 0);
    } else if (f.kind === 'line') len = lineLen(metricPts(Ly, f.pts));
    const kv = (k, v) => (k ? '<span class="k">' + k + ':</span> ' : '') + '<span class="v">' + v + '</span>';
    const sep = ' <span class="sep">|</span> ';
    const head = [];
    if (to !== '') head.push(kv('Số tờ', esc(to)));
    if (thua !== '') head.push(kv('Số thửa', esc(thua)));
    if (area != null) head.push(kv('Diện tích', fmt(area, 1) + ' m²'));
    if (len != null) head.push(kv('Chiều dài', fmt(len, 2) + ' m'));
    const line2 = [];
    if (loai !== '') line2.push(kv('Loại đất', esc(loai)));
    if (dtGhi !== '' && area != null) line2.push(kv('DT pháp lý', esc(dtGhi) + ' m²'));
    if (per != null) line2.push(kv('Chu vi', fmt(per, 2) + ' m'));
    if (nv) line2.push(kv('Số đỉnh', nv));
    if (area != null && area > 10000) line2.push(kv('', fmt(area / 10000, 4) + ' ha'));
    let rows = '';
    Object.keys(props).forEach(k => {
      if (['color', 'style', 'align'].includes(k) || props[k] == null || props[k] === '') return;
      const label = k === 'layer' ? (Ly.type === 'DGN' ? 'Level' : 'Layer') : k === 'etype' ? 'Loại' : k;
      rows += '<tr><td>' + esc(label) + '</td><td>' + esc(props[k]) + '</td></tr>';
    });
    // chuẩn bị kiểm kê
    ensureInventoryFields(Ly);
    const fis = Ly.fast && Ly.fast._sel ? Array.from(Ly.fast._sel) : [i];
    const curColor = f.markColor || null;
    const curNote = (f.props && f.props.GHI_CHU_KK) || '';
    // dựng HTML đổi màu
    const dotsHtml = MARK_COLORS.map(mc =>
      '<button class="fc-dot' + (curColor === mc.c ? ' on' : '') + '" data-c="' + mc.c + '" title="' + mc.n + '" style="' + _dotBg(mc.c, mc.h) + '"></button>'
    ).join('');
    const colorHtml =
      '<div class="fi-colors"><span class="fc-lab">Đổi màu:</span><div class="fc-list">' + dotsHtml +
      '<label class="fc-pick" title="Chọn màu khác"><input type="color" class="fc-inp" value="' + (curColor || '#22c55e') + '"><span>🎨</span></label>' +
      '<button class="fc-clr' + (curColor ? '' : ' hidden') + '" title="Bỏ màu (về mặc định)">↺ Bỏ</button>' +
      '<button class="fc-htog' + (useHatch ? ' on' : '') + '" title="Hatch / Solid">Hatch<span class="ht-sw"></span></button>' +
      '<button class="fc-htog fc-edge' + (showEdges ? ' on' : '') + '" title="Hiện/ẩn chiều dài cạnh">Cạnh<span class="ht-sw"></span></button>' +
      '<button class="fc-htog fc-vert' + (showVerts ? ' on' : '') + '" title="Hiện/ẩn đỉnh thửa đất">Đỉnh<span class="ht-sw"></span></button>' +
      '</div></div>';
    const noteHtml = '<div class="fi-note"><input type="text" class="fn-inp" placeholder="Ghi chú kiểm kê (vd: đã ký giáp ranh, vắng chủ…)" value="' + esc(curNote) + '"></div>';

    const box = $('fInfo');
    box.innerHTML =
      '<div class="fi-grip"></div>' +
      '<div class="fi-body">' +
      '<div class="fi-head"><div class="fi-title">🧭 ' + (f.kind === 'polygon' ? 'Thông tin thửa đất' : 'Thông tin đối tượng') + '</div>' +
      '<button class="fi-nav"><span class="fi-car">🚗</span>Dẫn đường</button><button class="fi-x" aria-label="Đóng">✕</button></div>' +
      '<div class="fi-card"><div class="fi-l1">' + (head.join(sep) || esc(Ly.name)) + '</div>' + (line2.length ? '<div class="fi-l2">' + line2.join(sep) + '</div>' : '') +
      (chu ? '<div class="fi-l2">' + kv('Chủ sử dụng', esc(chu)) + '</div>' : '') +
      '<div class="fi-src">' + esc(Ly.name) + '</div></div>' +
      colorHtml + noteHtml +
      '<div class="fi-btns"><button class="pc">📍 Tọa độ</button><button class="pt">☰ Thuộc tính</button><button class="pd">⬇ CAD</button></div>' +
      (rows ? '<details class="fi-more"><summary>Tất cả thuộc tính</summary><table>' + rows + '</table></details>' : '') +
      '</div>';
    box.classList.remove('hidden');
    // restore chiều cao đã kéo trước đó (nếu có)
    if (box._savedH) box.style.height = box._savedH + 'px';

    // === Kéo grip để resize panel ===
    const grip = box.querySelector('.fi-grip');
    if (grip) {
      let startY, startH;
      const onMove = (e) => {
        const y = e.touches ? e.touches[0].clientY : e.clientY;
        const newH = Math.max(80, Math.min(window.innerHeight * 0.85, startH + (startY - y)));
        box.style.height = newH + 'px';
        box._savedH = newH;
      };
      const onEnd = () => { document.removeEventListener('mousemove', onMove); document.removeEventListener('mouseup', onEnd); document.removeEventListener('touchmove', onMove); document.removeEventListener('touchend', onEnd); };
      const onStart = (e) => {
        startY = e.touches ? e.touches[0].clientY : e.clientY;
        startH = box.offsetHeight;
        document.addEventListener('mousemove', onMove); document.addEventListener('mouseup', onEnd);
        document.addEventListener('touchmove', onMove, { passive: false }); document.addEventListener('touchend', onEnd);
        e.preventDefault();
      };
      grip.addEventListener('mousedown', onStart);
      grip.addEventListener('touchstart', onStart, { passive: false });
    }

    // === Gắn sự kiện cho nút đổi màu ===
    function syncColorUI(col) {
      box.querySelectorAll('.fc-dot').forEach(d => d.classList.toggle('on', d.dataset.c === col));
      const clrBtn = box.querySelector('.fc-clr');
      if (clrBtn) { if (col) clrBtn.classList.remove('hidden'); else clrBtn.classList.add('hidden'); }
      const inp = box.querySelector('.fc-inp');
      if (inp && col) inp.value = col;
    }
    box.querySelectorAll('.fc-dot').forEach(dot => {
      dot.onclick = () => { const c = dot.dataset.c; setFeatureColor(Ly, fis, c); syncColorUI(c); };
    });
    const fcInp = box.querySelector('.fc-inp');
    if (fcInp) fcInp.oninput = () => { setFeatureColor(Ly, fis, fcInp.value); syncColorUI(fcInp.value); };
    const fcClr = box.querySelector('.fc-clr');
    if (fcClr) fcClr.onclick = () => { setFeatureColor(Ly, fis, null); syncColorUI(null); };
    const fcHtog = box.querySelector('.fc-htog');
    if (fcHtog) fcHtog.onclick = () => {
      useHatch = !useHatch;
      localStorage.setItem('lt_hatch', useHatch ? '1' : '0');
      fcHtog.classList.toggle('on', useHatch);
      // cập nhật preview dots
      box.querySelectorAll('.fc-dot').forEach((d, idx) => {
        const mc = MARK_COLORS[idx]; if (!mc) return;
        d.setAttribute('style', useHatch ? _dotBg(mc.c, mc.h) : 'background:' + mc.c);
      });
      // restyle + redraw tất cả layers
      layers.forEach(L2 => { if (L2.data && L2.fast) { L.FastLayer.restyle(L2.data, L2.features, colorOf(L2)); L2.fast.redraw(); } });
    };
    // === Gắn sự kiện cho toggle Cạnh / Đỉnh ===
    const fcEdge = box.querySelector('.fc-edge');
    if (fcEdge) fcEdge.onclick = () => {
      showEdges = !showEdges;
      localStorage.setItem('lt_edges', showEdges ? '1' : '0');
      fcEdge.classList.toggle('on', showEdges);
      if (geomSel) showGeomLabels(geomSel.Ly, geomSel.f);
    };
    const fcVert = box.querySelector('.fc-vert');
    if (fcVert) fcVert.onclick = () => {
      showVerts = !showVerts;
      localStorage.setItem('lt_verts', showVerts ? '1' : '0');
      fcVert.classList.toggle('on', showVerts);
      if (geomSel) showGeomLabels(geomSel.Ly, geomSel.f);
    };
    // === Gắn sự kiện cho ghi chú kiểm kê ===
    const fnInp = box.querySelector('.fn-inp');
    if (fnInp) fnInp.onchange = () => {
      fis.forEach(idx => { const ft = Ly.features[idx]; if (ft && ft.props) ft.props.GHI_CHU_KK = fnInp.value; });
      Ly.dirty = true; autoSaveSoon(300);
    };

    box.querySelector('.fi-x').onclick = closeInfo;
    box.querySelector('.pc').onclick = () => { box.classList.add('hidden'); Attr.showCoords(Ly, i); };
    box.querySelector('.pt').onclick = () => { box.classList.add('hidden'); Attr.showTable(Ly, { only: i }); };
    box.querySelector('.pd').onclick = () => { const r = Attr.buildDxf(Ly, [i]); Attr.doSave(Attr.safeName(Ly.name) + '_' + (i + 1) + '.dxf', r.text, 'application/dxf'); };
    box.querySelector('.fi-nav').onclick = () => {
      let p = latlng;
      if (f.kind === 'polygon') { try { const c = Attr.labelPoint(f.pts.map(q => ({ E: q[0], N: q[1] }))); const ll = Ly.P([c.E, c.N]); p = L.latLng(ll[0], ll[1]); } catch (e) { } }
      FindNav.navTo(p.lat, p.lng, Ly.name + (thua !== '' ? ' · ' + (to !== '' ? 'tờ ' + to + ' ' : '') + 'thửa ' + thua : ''));
    };
    // đưa cả thửa vào khoảng trống phía trên khung thông tin
    if (f.kind === 'polygon' || f.kind === 'line') {
      const b = L.latLngBounds(f.pts.map(p => { const ll = Ly.P(p); return [ll[0], ll[1]]; }));
      const h = box.offsetHeight || 220;
      geomSel = { Ly, f };
      map.fitBounds(b, { paddingTopLeft: [46, 120], paddingBottomRight: [46, h + 40], maxZoom: 20 });
    }
    showGeomLabels(Ly, f);
  }
  map.on('popupclose', () => { if ($('fInfo').classList.contains('hidden') && selLy && selLy.fast) selLy.fast.setSelection(null); });

  // ---------- Mở file ----------
  $('btnOpen').onclick = () => $('fileInput').click();
  /** Nạp một lần mở file. Giữ lại nội dung file gốc (batch) để lưu dự án. */
  async function openFiles(files, opt) {
    opt = opt || {};
    const arr = Array.from(files);
    const batch = opt.batch || { files: await Promise.all(arr.map(async f => ({ name: f.name, data: await f.arrayBuffer() }))) };
    const sets = await Loaders.loadFiles(arr, (m) => { $('loadingText').textContent = m; });
    const added = [];
    for (let k = 0; k < sets.length; k++) {
      const ds = sets[k];
      if (opt.only && !opt.only.has(k)) continue;
      $('loadingText').textContent = 'Đang dựng ' + ds.name + ' (' + ds.features.length + ' đối tượng)…';
      await new Promise(r => setTimeout(r, 20));
      const Ly = addDataset(ds);
      if (Ly) { Ly.src = { batch, k }; added.push(Ly); }
    }
    return { added, sets, batch };
  }

  $('fileInput').onchange = async (ev) => {
    const files = ev.target.files;
    if (!files || !files.length) return;
    loading(true, 'Đang đọc file…');
    let ask = null;
    const pj = Array.from(files).filter(f => /\.tlproj$/i.test(f.name));
    if (pj.length) {
      loading(false); ev.target.value = '';
      for (const f of pj) await importProjectFile(f);
      return;
    }
    try {
      const { added } = await openFiles(files);
      if (added.length) autoSaveSoon(300);
      const warns = added.filter(Ly => Ly.crs.warn).map(Ly => Ly.name + ': ⚠ ' + Ly.crs.warn);
      if (added.length) zoomTo(added[added.length - 1]);
      if (warns.length) toast(warns.join('\n'), true, 8000);
      // KTT tự nhận theo vị trí nhưng còn mập mờ: hỏi người dùng
      ask = added.find(Ly => { const d = Ly.crs.detected; return Ly.ktt == null && d && d.why === 'theo vị trí' && d.cands.length > 1 && d.prov !== S.prov; }) || null;
    } catch (e) {
      console.error(e);
      toast(e.userMessage || ('Lỗi đọc file: ' + (e.message || e)), true, 12000);
    } finally {
      loading(false);
      ev.target.value = '';
    }
    if (ask) setTimeout(() => showKttOptions(ask, true), 400);
  };

  // ---------- Dự án (lưu trên máy bằng IndexedDB) ----------
  const PDB = (() => {
    let dbp = null;
    const open = () => dbp || (dbp = new Promise((res, rej) => {
      const r = indexedDB.open('tlt_projects', 1);
      r.onupgradeneeded = () => { const db = r.result; ['meta', 'state', 'files'].forEach(n => { if (!db.objectStoreNames.contains(n)) db.createObjectStore(n, { keyPath: 'id' }); }); };
      r.onsuccess = () => res(r.result); r.onerror = () => { dbp = null; rej(r.error); };
    }));
    const run = async (stores, mode, fn) => {
      const db = await open();
      return new Promise((res, rej) => {
        const t = db.transaction(stores, mode);
        const reqs = fn((n) => t.objectStore(n));
        t.oncomplete = () => res(reqs && reqs.result !== undefined ? reqs.result : undefined);
        t.onerror = () => rej(t.error); t.onabort = () => rej(t.error || new Error('Bộ nhớ đầy hoặc bị từ chối'));
      });
    };
    return {
      list: () => run(['meta'], 'readonly', st => st('meta').getAll()),
      get: (store, id) => run([store], 'readonly', st => st(store).get(id)),
      put: (items) => run(Object.keys(items), 'readwrite', st => { for (const n in items) for (const v of items[n]) st(n).put(v); }),
      del: (id, fileIds) => run(['meta', 'state', 'files'], 'readwrite', st => { st('meta').delete(id); st('state').delete(id); (fileIds || []).forEach(f => st('files').delete(f)); })
    };
  })();
  let curProj = null; // {id, name}

  function layerState(Ly) {
    return {
      name: Ly.name, visible: Ly.visible, colorMode: Ly.colorMode, color: Ly.color, weight: Ly.weight, hidden: Array.from(Ly.hidden || []),
      ktt: Ly.ktt != null ? Ly.ktt : null, kttProv: Ly.kttProv || null, labelF1: Ly.labelF1 || '', labelF2: Ly.labelF2 || '',
      labelLines: Ly.labelLines || null, ranhColor: Ly.ranhColor || null, labelPx: Ly.labelPx || 13, labelZ: Ly.labelZ || 17,
      edgeLevels: Array.from(Ly.edgeLevels || []), close: Ly.closeUsed || null,
      props: Ly.dirty ? Ly.features.map(f => f.props || null) : null,
      marks: Ly.marks && Object.keys(Ly.marks).length ? Object.assign({}, Ly.marks) : null
    };
  }
  function applyState(Ly, st) {
    Ly.visible = st.visible !== false; Ly.colorMode = st.colorMode || 'file'; Ly.color = st.color || Ly.color; Ly.weight = st.weight || 1.5;
    Ly.hidden = new Set(st.hidden || []); Ly.labelF1 = st.labelF1 || ''; Ly.labelF2 = st.labelF2 || ''; Ly.labelLines = st.labelLines || null; Ly.ranhColor = st.ranhColor || null; Ly.labelPx = st.labelPx || 13; Ly.labelZ = st.labelZ || 17; Ly.edgeLevels = new Set(st.edgeLevels || []);
    let re = false;
    if ((st.ktt != null ? st.ktt : null) !== (Ly.ktt != null ? Ly.ktt : null)) { Ly.ktt = st.ktt; Ly.kttProv = st.kttProv; re = true; }
    if (Ly.isCad && JSON.stringify(st.close || null) !== JSON.stringify(Ly.closeUsed || null)) {
      autoClose(Ly, new Set(st.close ? st.close.levels : []), st.close ? st.close.tol : 0); assignLids(Ly); re = true;
    }
    if (st.props && st.props.length === Ly.features.length) {
      Ly.features.forEach((f, i) => { f.props = st.props[i] || f.props; });
      Ly.dirty = true; Ly._joined = true; Ly._fields = null; Ly._recs = null; Ly._guess = null;
    }
    // khôi phục marks kiểm kê
    if (st.marks) {
      Ly.marks = Object.assign({}, st.marks);
      Object.keys(Ly.marks).forEach(idx => { const ft = Ly.features[+idx]; if (ft) ft.markColor = Ly.marks[idx]; });
    }
    build(Ly, re);
    if (!re) rebuildExtra(Ly);
    if (!Ly.visible) { map.removeLayer(Ly.fast); map.removeLayer(Ly.text); if (Ly.extra) map.removeLayer(Ly.extra); }
  }
  function removeLayer(Ly) {
    map.removeLayer(Ly.fast); map.removeLayer(Ly.text); if (Ly.extra) map.removeLayer(Ly.extra);
    layers.splice(layers.indexOf(Ly), 1); refreshCount(); updateLuBar();
  }
  const fmtMB = (b) => (b / 1048576).toFixed(b < 10485760 ? 1 : 0).replace('.', ',') + ' MB';
  const fmtTime = (t) => { const d = new Date(t); const z = (n) => String(n).padStart(2, '0'); return z(d.getDate()) + '/' + z(d.getMonth() + 1) + '/' + d.getFullYear() + ' ' + z(d.getHours()) + ':' + z(d.getMinutes()); };

  /** Lưu dự án. asNew: tạo dự án mới với tên name. quiet: tự lưu (không báo). */
  async function saveProject(name, asNew, quiet) {
    const keep = layers.filter(Ly => Ly.src);
    if (!keep.length) { if (!quiet) toast('Chưa có lớp nào (mở từ file) để lưu.', true); return; }
    const id = (!asNew && curProj) ? curProj.id : 'p' + Date.now().toString(36);
    const old = (!asNew && curProj) ? await PDB.get('meta', id) : null;
    const batches = [];
    keep.forEach(Ly => { if (batches.indexOf(Ly.src.batch) < 0) batches.push(Ly.src.batch); });
    const fileRecs = [];
    let size = 0;
    const fileIds = batches.map(b => {
      // mỗi dự án giữ bản file riêng (xóa dự án này không ảnh hưởng dự án khác)
      if (b.savedIn !== id || !b.fid) { b.fid = 'f' + Date.now().toString(36) + Math.random().toString(36).slice(2, 7); fileRecs.push({ id: b.fid, files: b.files }); }
      b.files.forEach(f => size += f.data.byteLength);
      return b.fid;
    });
    const c = map.getCenter();
    const state = {
      id, view: { c: [c.lat, c.lng], z: map.getZoom() }, base: S.base,
      settings: { mode: S.mode, lon0: S.lon0, prov: S.prov, swap: S.swap, usePrj: S.usePrj, autoLon0: S.autoLon0, closeLevels: S.closeLevels, closeTol: S.closeTol, autoClose: S.autoClose },
      batches: fileIds, layers: keep.map(Ly => ({ b: batches.indexOf(Ly.src.batch), k: Ly.src.k, st: layerState(Ly) }))
    };
    const meta = { id, name: name || (old && old.name) || (curProj && curProj.name) || 'Dự án', created: old ? old.created : Date.now(), updated: Date.now(), nLayers: keep.length, size, layerNames: keep.map(Ly => Ly.name).slice(0, 8), fileIds };
    if (!quiet) loading(true, 'Đang lưu dự án…');
    try {
      await PDB.put({ meta: [meta], state: [state], files: fileRecs });
      batches.forEach(b => b.savedIn = id);
      // file cũ không còn dùng trong dự án này
      if (old && old.fileIds) { const gone = old.fileIds.filter(f => fileIds.indexOf(f) < 0); if (gone.length) await PDB.del('__none__', gone); }
      curProj = { id, name: meta.name };
      try { localStorage.setItem('lastProj', id); } catch (e) { }
      if (!quiet) toast('Đã lưu dự án "' + meta.name + '" (' + keep.length + ' lớp, ' + fmtMB(size) + ')');
    } catch (e) { if (!quiet) toast('Không lưu được dự án: ' + (e && e.message || e), true); }
    finally { if (!quiet) loading(false); }
  }

  async function openProject(id, silent) {
    const meta = await PDB.get('meta', id), st = await PDB.get('state', id);
    if (!meta || !st) { if (!silent) toast('Không tìm thấy dữ liệu dự án.', true); return; }
    if (layers.length && !(curProj && curProj.id === id) && !confirm('Mở dự án "' + meta.name + '" sẽ đóng ' + layers.length + ' lớp đang mở. Tiếp tục?')) return;
    closeSheet(); closeInfo();
    loading(true, 'Đang mở dự án ' + meta.name + '…');
    try {
      layers.slice().forEach(removeLayer);
      Object.assign(S, st.settings || {}); window.__dgnUor = S.dgnUor || 0; save();
      if (st.base && st.base !== S.base) setBase(st.base);
      const loaded = [];
      for (let bi = 0; bi < st.batches.length; bi++) {
        const rec = await PDB.get('files', st.batches[bi]);
        if (!rec) { loaded.push(null); continue; }
        const batch = { files: rec.files, fid: rec.id, savedIn: id };
        const files = rec.files.map(f => new File([f.data], f.name));
        const sets = await Loaders.loadFiles(files, (m) => { $('loadingText').textContent = m; });
        loaded.push({ batch, sets });
      }
      let miss = 0;
      for (const L0 of st.layers) {
        const b = loaded[L0.b], ds = b && b.sets[L0.k];
        if (!ds) { miss++; continue; }
        $('loadingText').textContent = 'Đang dựng ' + ds.name + '…';
        await new Promise(r => setTimeout(r, 20));
        const Ly = addDataset(ds);
        if (!Ly) continue;
        Ly.src = { batch: b.batch, k: L0.k };
        try { applyState(Ly, L0.st || {}); } catch (e) { console.warn('applyState', e); }
      }
      curProj = { id, name: meta.name };
      try { localStorage.setItem('lastProj', id); } catch (e) { }
      if (st.view) map.setView(st.view.c, st.view.z);
      toast((silent ? 'Đã mở lại dự án "' : 'Đã mở dự án "') + meta.name + '"' + (miss ? ' (thiếu ' + miss + ' lớp)' : ''));
    } catch (e) { console.error(e); toast('Lỗi mở dự án: ' + (e.message || e), true); }
    finally { loading(false); }
  }

  async function showProjects() {
    const box = document.createElement('div');
    let list = [];
    try { list = (await PDB.list()).sort((a, b) => b.updated - a.updated); } catch (e) { toast('Không đọc được bộ nhớ dự án: ' + e.message, true); }
    const nLy = layers.filter(Ly => Ly.src).length;
    box.innerHTML =
      '<div class="hint">Dự án lưu lại các file đã mở (bản gốc) cùng hệ tọa độ, tỉnh/KTT, Level đang tắt, màu nét, nhãn, thửa tự khép, chỉnh sửa thuộc tính và vị trí bản đồ. Lưu ngay trên máy, không cần mạng.</div>' +
      (curProj ? '<div class="info">Đang mở: <b>' + esc(curProj.name) + '</b></div>' : '') +
      '<div class="btnrow">' + (curProj ? '<button class="primary" id="pjSave">💾 Lưu</button>' : '') + '<button' + (curProj ? '' : ' class="primary"') + ' id="pjNew">＋ Lưu thành dự án mới</button></div>' +
      '<div class="hint">' + nLy + ' lớp đang mở có thể lưu.</div>' +
